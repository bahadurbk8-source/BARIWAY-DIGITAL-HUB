<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | BARIWAY DIGITAL HUB</title>

    <link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>Create Account</h1>

        <p>BARIWAY DIGITAL HUB</p>


        <form id="registerForm">

            <input
                type="text"
                id="regUsername"
                placeholder="Enter Username"
                required
            >


            <input
                type="email"
                id="regEmail"
                placeholder="Enter Email"
                required
            >


            <input
                type="password"
                id="regPassword"
                placeholder="Create Password"
                required
            >


            <button type="submit">
                CREATE ACCOUNT →
            </button>

        </form>


        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
